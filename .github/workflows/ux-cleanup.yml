name: Apply UX Cleanup

on:
  push:
    paths:
      - scripts/apply_ux_cleanup.py
      - .github/workflows/ux-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair patch script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_ux_cleanup.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              "'backgroundColor = if (isToday) MaterialTheme.colorScheme.primary.copy(alpha = 0.12f) else MaterialTheme.colorScheme.surface.copy(alpha = 0.96f),'\n    1",
              "'backgroundColor = if (isToday) MaterialTheme.colorScheme.primary.copy(alpha = 0.12f) else MaterialTheme.colorScheme.surface.copy(alpha = 0.96f),',\n    1"
          )
          t = t.replace(
              "'color = if (isToday) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface'\n    1",
              "'color = if (isToday) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurface',\n    1"
          )
          p.write_text(t, encoding='utf-8')
          PY
      - name: Apply UX cleanup patch
        run: python scripts/apply_ux_cleanup.py
      - name: Commit UX cleanup
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "WoW Note Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/whispermmepub/wownote/MainActivity.kt app/src/main/java/com/whispermmepub/wownote/WoWNoteApp.kt app/src/main/java/com/whispermmepub/wownote/editor/RichEditText.kt app/build.gradle.kts
          git commit -m "Polish editor calendar theme and back behavior"
          git push origin main
